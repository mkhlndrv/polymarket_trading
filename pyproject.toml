[project]
name = "weather-edge"
version = "1.0.0"
description = "Is there a tradeable edge in Polymarket's daily temperature markets? A calibrated forecast model scored against the market, backtested on the trade tape, and held out once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "duckdb",
    "eccodes",
    "eccodeslib>=2.49.0.30",
    "fsspec",
    "huggingface-hub",
    "matplotlib",
    "pandas",
    "pyarrow",
    "requests",
    "scipy",
    "tabulate",
]

[dependency-groups]
dev = ["ipykernel", "jupyter", "nbconvert", "pre-commit", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_edge"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The notebooks are executed documents. Reformatting a cell would leave its stored output describing
# source that no longer exists, and import order in a notebook that runs top to bottom is not a defect.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # the formatter sets code width; long SQL and text strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
